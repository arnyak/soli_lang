<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="Paying an invoice in a Soli app. A request POST /invoices/:id/pay reaches a thin controller, which calls the PayInvoice service. Inside one transaction, the Invoice aggregate (total and paid are Amount value objects, guarded by invariants) asks the Account (credit is an Amount) to debit itself. The outcome is 200 paid, 422 InsufficientFunds with its message, or 409 InvoiceAlreadyPaid; an Amount below zero cannot exist.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="1024" height="576" fill="url(#bg)"/>

  <text x="512" y="62" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="#e5e7eb">Domain-driven design in Soli</text>
  <text x="512" y="92" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#8b929e">the rules live in the domain; the controller only asks</text>

  <!-- request -->
  <rect x="30" y="230" width="150" height="80" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="105" y="262" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600" fill="#e5e7eb">Request</text>
  <text x="105" y="286" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8b929e">POST /invoices/:id/pay</text>
  <line x1="182" y1="270" x2="214" y2="270" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- service + transaction -->
  <rect x="218" y="128" width="500" height="372" rx="16" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="238" y="156" font-family="ui-monospace, monospace" font-size="14" fill="#f59e0b">PayInvoice — Invoice.transaction do … end</text>

  <!-- invoice aggregate -->
  <rect x="240" y="176" width="270" height="200" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="260" y="206" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#e5e7eb">Invoice &lt; Model</text>
  <text x="260" y="226" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b929e">the aggregate</text>
  <text x="260" y="256" font-family="ui-monospace, monospace" font-size="12.5" fill="#e5e7eb">value_field :total, Amount</text>
  <text x="260" y="276" font-family="ui-monospace, monospace" font-size="12.5" fill="#e5e7eb">value_field :paid, Amount</text>
  <text x="260" y="304" font-family="ui-monospace, monospace" font-size="12.5" fill="#f59e0b">invariant(:paid,</text>
  <text x="276" y="322" font-family="ui-monospace, monospace" font-size="12.5" fill="#f59e0b">"cannot exceed the total")</text>
  <text x="260" y="354" font-family="ui-monospace, monospace" font-size="12.5" fill="#e5e7eb">def pay_from(account)</text>

  <!-- account -->
  <rect x="540" y="176" width="160" height="200" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="560" y="206" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#e5e7eb">Account</text>
  <text x="560" y="226" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8b929e">prepaid credit</text>
  <text x="560" y="256" font-family="ui-monospace, monospace" font-size="12.5" fill="#e5e7eb">credit: Amount</text>
  <text x="560" y="290" font-family="ui-monospace, monospace" font-size="11.5" fill="#8b929e">not enough credit:</text>
  <text x="560" y="308" font-family="ui-monospace, monospace" font-size="11.5" fill="#ef4444">InsufficientFunds</text>
  <text x="560" y="354" font-family="ui-monospace, monospace" font-size="12.5" fill="#e5e7eb">def debit(amount)</text>
  <line x1="512" y1="350" x2="536" y2="350" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- value object -->
  <rect x="240" y="396" width="460" height="86" rx="14" fill="#141108" stroke="#d97706"/>
  <text x="260" y="424" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#f59e0b">Amount &lt; ValueObject</text>
  <text x="260" y="448" font-family="ui-monospace, monospace" font-size="12.5" fill="#e5e7eb">cents: Int · currency: String · equal by value · immutable</text>
  <text x="260" y="468" font-family="ui-monospace, monospace" font-size="12.5" fill="#8b929e">invariant(:cents, "an amount is never negative")</text>

  <!-- outcomes -->
  <line x1="720" y1="230" x2="782" y2="200" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <line x1="720" y1="300" x2="782" y2="300" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <line x1="720" y1="370" x2="782" y2="400" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>

  <rect x="786" y="164" width="210" height="74" rx="14" fill="#0e1a12" stroke="#22c55e"/>
  <text x="806" y="196" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#22c55e">200</text>
  <text x="852" y="196" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#e5e7eb">paid</text>
  <text x="806" y="220" font-family="ui-monospace, monospace" font-size="11.5" fill="#8b929e">both saved, one commit</text>

  <rect x="786" y="264" width="210" height="74" rx="14" fill="#1a0f0f" stroke="#ef4444"/>
  <text x="806" y="296" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#ef4444">422</text>
  <text x="852" y="296" font-family="ui-monospace, monospace" font-size="13" fill="#e5e7eb">InsufficientFunds</text>
  <text x="806" y="320" font-family="ui-monospace, monospace" font-size="11.5" fill="#8b929e">a DomainError, its message</text>

  <rect x="786" y="364" width="210" height="74" rx="14" fill="#1a0f0f" stroke="#ef4444"/>
  <text x="806" y="396" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#ef4444">409</text>
  <text x="852" y="396" font-family="ui-monospace, monospace" font-size="13" fill="#e5e7eb">AlreadyPaid</text>
  <text x="806" y="420" font-family="ui-monospace, monospace" font-size="11.5" fill="#8b929e">static http_status = 409</text>

  <text x="512" y="534" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#8b929e">A throw anywhere inside the transaction rolls back every write; nothing below zero can even be built.</text>
</svg>
