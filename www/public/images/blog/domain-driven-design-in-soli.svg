<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="Paying an invoice. POST /invoices/:id/pay calls Billing::PayInvoice, which runs one transaction: the Invoice aggregate (Amount value fields, invariants, optimistic lock) debits the Account and records InvoicePaid. The answer is 200, 422 InsufficientFunds or 409 InvoiceAlreadyPaid / StaleRecord. After the commit, InvoicePaid reaches a Shipping subscriber that creates a shipment, a ReceiptJob enqueued in the transaction (the outbox), and the billing topic of es.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1024" height="576" fill="url(#bg)"/>

  <text x="512" y="56" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="#e5e7eb">Domain-driven design in Soli</text>
  <text x="512" y="84" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#8b929e">one use case, one transaction — what happened travels on once it is committed</text>

  <!-- request -->
  <rect x="28" y="196" width="132" height="70" rx="14" fill="#101319" stroke="#2b3038"/>
  <text x="94" y="226" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e5e7eb">Request</text>
  <text x="94" y="248" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#8b929e">POST /invoices/:id/pay</text>
  <line x1="162" y1="231" x2="190" y2="231" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Billing context + transaction -->
  <rect x="194" y="110" width="430" height="300" rx="16" fill="none" stroke="#2b3038" stroke-width="1.5"/>
  <text x="212" y="134" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#e5e7eb">module Billing</text>
  <rect x="206" y="146" width="406" height="206" rx="12" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="222" y="168" font-family="ui-monospace, monospace" font-size="12" fill="#f59e0b">PayInvoice — Invoice.transaction do … end</text>

  <rect x="220" y="180" width="200" height="158" rx="12" fill="#101319" stroke="#2b3038"/>
  <text x="236" y="204" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e5e7eb">Invoice</text>
  <text x="236" y="226" font-family="ui-monospace, monospace" font-size="10.5" fill="#e5e7eb">value_field :total, Amount</text>
  <text x="236" y="244" font-family="ui-monospace, monospace" font-size="11" fill="#e5e7eb">optimistic_lock</text>
  <text x="236" y="266" font-family="ui-monospace, monospace" font-size="11" fill="#f59e0b">invariant(:paid, …)</text>
  <text x="236" y="292" font-family="ui-monospace, monospace" font-size="11" fill="#e5e7eb">pay_from(account)</text>
  <text x="236" y="314" font-family="ui-monospace, monospace" font-size="11" fill="#22c55e">record_event(InvoicePaid)</text>

  <rect x="436" y="180" width="164" height="158" rx="12" fill="#101319" stroke="#2b3038"/>
  <text x="452" y="204" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e5e7eb">Account</text>
  <text x="452" y="226" font-family="ui-monospace, monospace" font-size="11" fill="#e5e7eb">credit: Amount</text>
  <text x="452" y="244" font-family="ui-monospace, monospace" font-size="11" fill="#e5e7eb">optimistic_lock</text>
  <text x="452" y="292" font-family="ui-monospace, monospace" font-size="11" fill="#e5e7eb">debit(amount)</text>
  <text x="452" y="314" font-family="ui-monospace, monospace" font-size="10.5" fill="#ef4444">InsufficientFunds</text>

  <rect x="206" y="362" width="406" height="38" rx="10" fill="#141108" stroke="#d97706"/>
  <text x="222" y="386" font-family="ui-monospace, monospace" font-size="11.5" fill="#f59e0b">Amount &lt; ValueObject</text>
  <text x="420" y="386" font-family="ui-monospace, monospace" font-size="11" fill="#8b929e">equal by value · immutable</text>

  <!-- answers -->
  <text x="194" y="440" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">Answers</text>
  <rect x="194" y="452" width="100" height="40" rx="10" fill="#0e1a12" stroke="#22c55e"/>
  <text x="244" y="477" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#22c55e">200 paid</text>
  <rect x="304" y="452" width="155" height="40" rx="10" fill="#1a0f0f" stroke="#ef4444"/>
  <text x="381" y="477" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#ef4444">422 InsufficientFunds</text>
  <rect x="469" y="452" width="155" height="40" rx="10" fill="#1a0f0f" stroke="#ef4444"/>
  <text x="546" y="477" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#ef4444">409 AlreadyPaid · Stale</text>

  <!-- after commit -->
  <line x1="626" y1="260" x2="660" y2="260" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="664" y="110" width="334" height="300" rx="16" fill="none" stroke="#22c55e" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="682" y="134" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#22c55e">InvoicePaid, after the commit</text>

  <rect x="680" y="150" width="302" height="72" rx="12" fill="#101319" stroke="#2b3038"/>
  <text x="696" y="174" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#e5e7eb">module Shipping</text>
  <text x="696" y="196" font-family="ui-monospace, monospace" font-size="11" fill="#8b929e">subscribe … do |event|</text>
  <text x="696" y="212" font-family="ui-monospace, monospace" font-size="11" fill="#e5e7eb">  Shipment.create(…)</text>

  <rect x="680" y="232" width="302" height="72" rx="12" fill="#101319" stroke="#2b3038"/>
  <text x="696" y="256" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#e5e7eb">ReceiptJob</text>
  <text x="696" y="278" font-family="ui-monospace, monospace" font-size="11" fill="#8b929e">enqueued in the transaction</text>
  <text x="696" y="294" font-family="ui-monospace, monospace" font-size="11" fill="#e5e7eb">the outbox, with retries</text>

  <rect x="680" y="314" width="302" height="80" rx="12" fill="#101319" stroke="#2b3038"/>
  <text x="696" y="338" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#e5e7eb">es topic "billing"</text>
  <text x="696" y="360" font-family="ui-monospace, monospace" font-size="11" fill="#8b929e">{"stream": "billing", "key": "number"}</text>
  <text x="696" y="378" font-family="ui-monospace, monospace" font-size="11" fill="#e5e7eb">for other services</text>

  <text x="831" y="446" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8b929e">a rollback publishes nothing</text>
  <text x="512" y="540" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#8b929e">value objects · aggregates with invariants and locks · domain errors · events · bounded contexts</text>
</svg>
